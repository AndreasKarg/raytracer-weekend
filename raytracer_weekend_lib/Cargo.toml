[package]
name = "raytracer_weekend_lib"
version = "0.1.0"
authors = ["Andreas Karg <clonkman.alternative@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rand = { workspace = true, default-features = false }
rayon = { version = "1.10.0", optional = true }
itertools = { version = "0.13.0", default-features = false }
image = { version = "0.25.2", optional = true }
dyn-clone = "1.0.17"
num-traits = { version = "0.2.19", default-features = false }
wavefront_obj = { version = "10.0.0", optional = true }
micromath = { version = "2.1", optional = true, features = ["num-traits"] }
serde = { version = "1.0.204", optional = true, default-features = false, features = ["derive"] }
iter_fixed = "0.4.0"
derive-new = "0.7.0"
derive-where = "1.7.0"

[features]
default = ["std"]
std = ["wavefront_obj", "image", "rand/thread_rng", "itertools/default", "num-traits/default", "rayon"]
no_std = ["micromath"]

[dev-dependencies]
criterion = "0.5.1"

[profile.release]
debug = true

[[bench]]
name = "basic_benchmark"
harness = false
